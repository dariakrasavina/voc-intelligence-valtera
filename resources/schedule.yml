resources:
  jobs:
    voc_daily_8am:
      name: valtera-voc-daily-8am
      description: >
        Time-based catch-up for valtera-voc-end-to-end: runs it every day at 08:00 America/New_York, even if no
        file arrived. Separate job because a job can have only one of schedule / trigger / continuous, and
        valtera-voc-end-to-end uses the file-arrival trigger.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: run_end_to_end
          run_job_task:
            job_id: ${resources.jobs.voc_end_to_end.id}
