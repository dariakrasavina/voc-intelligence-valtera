resources:
  jobs:
    voc_end_to_end:
      name: valtera-voc-end-to-end
      description: >
        Daily VOC flow: land export -> Lakeflow ingest -> rule tags + ai_classify + sentiment model
        -> gold + emerging-issue alerts -> Lakebase escalation queue sync -> evaluation evidence.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: landing_path
          default: ${var.landing_path}
        - name: evidence_path
          default: ${var.evidence_path}
        - name: generate_mode
          default: backfill
        - name: lakebase_project
          default: ${var.lakebase_project}
      tasks:
        - task_key: land_export
          notebook_task:
            notebook_path: ../src/notebooks/00_land_export.py
        - task_key: lakeflow_ingest
          depends_on: [{task_key: land_export}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.voc_ingest.id}
        - task_key: governance
          depends_on: [{task_key: lakeflow_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/05_governance.py
        - task_key: rule_tagging
          depends_on: [{task_key: lakeflow_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/10_rule_tagging.py
        - task_key: ai_classify
          depends_on: [{task_key: lakeflow_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/20_ai_classify.py
        - task_key: sentiment_model
          depends_on: [{task_key: lakeflow_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/30_sentiment_model.py
        - task_key: gold_and_alerts
          depends_on: [{task_key: rule_tagging}, {task_key: ai_classify}, {task_key: sentiment_model}]
          notebook_task:
            notebook_path: ../src/notebooks/40_gold_and_alerts.py
        - task_key: lakebase_sync
          depends_on: [{task_key: gold_and_alerts}]
          notebook_task:
            notebook_path: ../src/notebooks/50_lakebase_sync.py
        - task_key: evaluate
          depends_on: [{task_key: gold_and_alerts}]
          notebook_task:
            notebook_path: ../src/notebooks/60_evaluate.py
