resources:
  jobs:
    voc_end_to_end:
      name: valtera-voc-end-to-end
      description: >
        VOC flow: Lakeflow ingest -> rule tags + ai_classify + sentiment model -> gold + emerging-issue alerts
        -> Lakebase escalation queue sync -> evaluation evidence. Starts when a new export lands in the
        landing volume (file-arrival trigger). Exports are landed from outside the job (scripts/land_export.sh plays
        the source system).
        This job never writes to the landing volume, so it cannot trigger itself.
      max_concurrent_runs: 1
      queue:
        enabled: true
      # Event-driven: a new contact-center / survey export file in the landing volume starts a run.
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: ${var.landing_path}/
          min_time_between_triggers_seconds: 300   # at most one triggered run every 5 minutes
          wait_after_last_change_seconds: 120      # wait until the export has finished writing
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: landing_path
          default: ${var.landing_path}
        - name: evidence_path
          default: ${var.evidence_path}
        - name: lakebase_project
          default: ${var.lakebase_project}
      tasks:
        - task_key: lakeflow_ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.voc_ingest.id}
        - task_key: governance
          depends_on: [{task_key: lakeflow_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/01_governance.py
        - task_key: rule_tagging
          depends_on: [{task_key: lakeflow_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/02_rule_tagging.py
        - task_key: ai_classify
          depends_on: [{task_key: lakeflow_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/03_ai_classify.py
        - task_key: sentiment_model
          depends_on: [{task_key: lakeflow_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/04_sentiment_model.py
        - task_key: gold_and_alerts
          depends_on: [{task_key: rule_tagging}, {task_key: ai_classify}, {task_key: sentiment_model}]
          notebook_task:
            notebook_path: ../src/notebooks/05_gold_and_alerts.py
        - task_key: lakebase_sync
          depends_on: [{task_key: gold_and_alerts}]
          notebook_task:
            notebook_path: ../src/notebooks/06_lakebase_sync.py
        - task_key: evaluate
          depends_on: [{task_key: gold_and_alerts}]
          notebook_task:
            notebook_path: ../src/notebooks/07_evaluate.py
