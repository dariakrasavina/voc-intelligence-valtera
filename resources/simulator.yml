resources:
  jobs:
    voc_export_simulator:
      name: valtera-voc-export-simulator
      description: >
        Plays the source system: writes the synthetic Valtera contact-center + survey export into the landing
        volume. generate_mode=backfill lands 90 days; generate_mode=daily lands one day (day=YYYY-MM-DD).
        Run manually. Each landing triggers valtera-voc-end-to-end through its file-arrival trigger.
      max_concurrent_runs: 1
      parameters:
        - name: landing_path
          default: ${var.landing_path}
        - name: evidence_path
          default: ${var.evidence_path}
        - name: generate_mode
          default: daily
        - name: day
          default: ""
      tasks:
        - task_key: generate_export
          notebook_task:
            notebook_path: ../src/notebooks/01_generate_export.py
