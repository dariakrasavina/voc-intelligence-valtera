bundle:
  name: valtera-voc-app

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  genie_space_id:
    description: Genie Space ID (created by src/genie/genie_space.py)
  genie_space_name:
    description: Genie Space name
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.

resources:
  apps:
    app:
      name: "valtera-voc-app"
      description: "Valtera Motors VOC Intelligence: emerging issues, escalation queue (Lakebase), Genie"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, genie, files, model-serving
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net

    variables:
      sql_warehouse_id: 148ccb90800933a1
      postgres_branch: projects/valtera-voc/branches/production
      postgres_database: projects/valtera-voc/branches/production/databases/databricks-postgres
      genie_space_id: 01f1e46e16d61008a7f72226f0aacb03
      genie_space_name: Valtera VOC Insights
