# Valtera Motors - VOC Intelligence (FE Bar build). Everything is deployed as one bundle.
bundle:
  name: voc-intelligence-valtera

include:
  - resources/*.yml

sync:
  exclude:
    - app/**
    - evidence/**
    - docs/**

variables:
  catalog:
    default: daria_krasavina
  schema:
    default: voc_valtera
  warehouse_id:
    description: SQL warehouse used by the app, Genie Agent and dashboard queries
    default: 148ccb90800933a1
  lakebase_project:
    default: valtera-voc
  landing_path:
    default: /Volumes/daria_krasavina/voc_valtera/landing
  evidence_path:
    default: /Volumes/daria_krasavina/voc_valtera/evidence

targets:
  dev:
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
